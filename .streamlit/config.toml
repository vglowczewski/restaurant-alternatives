[theme]
base = "light"
primaryColor = "#4A8DB7"
backgroundColor = "#EAF4FA"
secondaryBackgroundColor = "#F6FAFD"
textColor = "#1B2A41"
borderColor = "#D3E5F0"
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap, sans-serif"
baseRadius = "16px"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
